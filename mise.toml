# https://mise.jdx.dev/configuration.html
[tools]
actionlint = "1.7.12"
dprint = "0.57.4"
gitleaks = "8.30.1"
jq = "1.8.2"
lefthook = "2.1.12"
lychee = "0.24.2"
python = "3.14.7"
shellcheck = "0.11.0"
trivy = "0.74.0"
"aqua:astral-sh/uv" = "0.12.10"
yq = "4.53.6"
# 1.30 requires GitHub's new $/ self-reference, which actionlint 1.7.12 cannot parse yet
# (rhysd/actionlint#711). Keep both strict gates warning-free rather than suppressing either.
zizmor = "1.29.0"

[settings]
aqua.cosign = true
github_attestations = true
locked_verify_provenance = true
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64"]
minimum_release_age = "0d"
slsa = true

[settings.task]
run_auto_install = false

[tasks.all]
alias = "a"
description = "Format, check, test, and build the project"
run = ["mise run format", "mise run check", "mise run test", "mise run build"]

[tasks.benchmark]
description = "Observe build and retrieval latency over a deterministic 20k-record corpus"
run = "uv run python scripts/benchmark_scale.py"

[tasks.build]
alias = "b"
description = "Build and verify the wheel and source distribution"
run = ["uv sync --locked", "uv build --clear", "mise run test:package"]

[tasks.check]
alias = "c"
description = "Run every static check in parallel"
depends = [
  "check:actions",
  "check:docs",
  "check:format",
  "check:leaks",
  "check:links",
  "check:lint",
  "check:scan",
  "check:schema",
  "check:shell",
  "check:types",
  "check:vuln",
]

[tasks."check:actions"]
description = "Validate GitHub Actions and Dependabot configuration"
run = [
  "actionlint",
  "zizmor --offline --persona=pedantic .github/workflows",
  "zizmor --offline --collect dependabot --strict-collection .",
]

[tasks."check:docs"]
description = "Build strict documentation and check rendered links and anchors"
run = [
  "uv run zensical build --clean --strict",
  'lychee --offline --include-fragments --index-files index.html --root-dir "$PWD/site" --no-progress "site/brain-framework/**/*.html"',
]

[tasks."check:format"]
alias = "cf"
description = "Check Python, metadata, lockfile, markup, and whitespace formatting"
run = [
  "uv run validate-pyproject pyproject.toml",
  "uv run ruff format --check",
  "dprint check",
  "uv lock --check",
  "git diff --check \"$(git hash-object -t tree /dev/null)\"",
]

[tasks."check:leaks"]
alias = "cs"
description = "Scan recent commits and the working tree for secrets"
run = ["mise run check:leaks:history", "gitleaks dir . --redact=100 --verbose"]

[tasks."check:leaks:history"]
description = "Scan the last 100 commits for secrets"
run = "gitleaks git --redact=100 --log-opts=--max-count=100 --verbose"

[tasks."check:leaks:staged"]
description = "Scan the staged snapshot for secrets"
run = "gitleaks git --staged --redact=100 --verbose"

[tasks."check:links"]
description = "Check repository Markdown links; check:docs owns documentation links"
run = "lychee --offline --no-progress --hidden --extensions md --exclude-path '(^|/)docs/' ."

[tasks."check:lint"]
alias = "cl"
description = "Lint application, tests, and shipped Python helpers (Ruff)"
run = "uv run ruff check"

[tasks."check:outdated"]
description = "Report drift in the pinned toolchain without failing the gate"
run = "mise outdated --local --bump || true"

[tasks."check:scan"]
description = "Scan the repository for vulnerabilities, secrets, licenses, and misconfigurations"
run = "trivy --config trivy.yaml fs ."

[tasks."check:schema"]
description = "Verify the committed JSON Schema matches the Python configuration loader"
run = [
  "mkdir -p .cache",
  "uv run bf schema > .cache/schema-current.json",
  "jq -S . .cache/schema-current.json > .cache/schema-actual.json",
  "jq -S . docs/bf.schema.json > .cache/schema-expected.json",
  "diff -u .cache/schema-expected.json .cache/schema-actual.json",
]

[tasks."check:shell"]
description = "Lint every shipped and release shell helper"
run = "shellcheck -S warning scripts/release-notes scripts/verify-release-tag"

[tasks."check:types"]
alias = "ct"
description = "Type-check Python sources (ty)"
run = "uv run ty check"

[tasks."check:vuln"]
alias = "cv"
description = "Scan locked Python dependencies for known vulnerabilities"
run = "uv audit --preview-features audit-command --locked"

[tasks.clean]
alias = "n"
description = "Remove generated build, test, and documentation output"
run = "rm -rf dist site .cache .coverage htmlcov .pytest_cache .ruff_cache"

[tasks.coverage]
alias = "v"
description = "Write an HTML branch-coverage report"
depends = ["test"]
run = "uv run coverage html"

[tasks."docs:build"]
description = "Build the documentation site into site/brain-framework"
run = "uv run zensical build --clean --strict"

[tasks."docs:watch"]
alias = "w"
description = "Serve the documentation site locally with live reload"
run = "uv run zensical serve"

[tasks.format]
alias = "f"
description = "Format Python, JSON, Markdown, TOML, and YAML"
run = ["mise run format:imports", "mise run format:python", "mise run format:dprint"]

[tasks."format:dprint"]
description = "Format JSON, Markdown, TOML, and YAML"
run = "dprint fmt --allow-no-files"

[tasks."format:python"]
description = "Format Python sources"
run = "uv run ruff format --force-exclude"

[tasks."format:imports"]
description = "Sort Python imports"
run = "uv run ruff check --select=I --fix --force-exclude"

[tasks."generate:schema"]
description = "Generate the schema before replacing the committed copy"
run = [
  "mkdir -p .cache",
  "uv run bf schema > .cache/schema-generated.json",
  "mv .cache/schema-generated.json docs/bf.schema.json",
  "dprint fmt docs/bf.schema.json",
]

[tasks.install]
alias = "i"
description = "Sync locked dependencies and install Git hooks"
run = ["uv sync --locked", "lefthook install"]

[tasks.test]
alias = "t"
description = "Run isolated tests with at least 85% branch coverage"
env.TZ = "UTC"
run = "uv run pytest --cov --cov-report=term-missing"

[tasks."test:package"]
description = "Smoke-test the wheel and source distribution outside the checkout"
run = "uv run python scripts/test_package.py"

[tasks."test:watch"]
alias = "tw"
description = "Run the test suite in watch mode"
run = "uv run pytest-watcher ."

[tasks.upgrade]
alias = "u"
description = "Upgrade dependencies to latest compatible versions"
run = "uv sync --upgrade"

[tasks.watch]
description = "Run the Brain Framework CLI from the working tree"
run = "uv run bf"
