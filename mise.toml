# https://mise.jdx.dev/configuration.html
[tools]
actionlint = "1.7.12"
dprint = "0.57.4"
gitleaks = "8.30.1"
jq = "1.8.2"
lefthook = "2.1.14"
lychee = "0.24.2"
python = "3.14.7"
shellcheck = "0.11.0"
trivy = "0.74.0"
"aqua:astral-sh/uv" = "0.12.20"
# 1.30 requires GitHub's new $/ self-reference, which actionlint 1.7.12 cannot parse yet
# (rhysd/actionlint#711). Keep both strict gates warning-free rather than suppressing either.
zizmor = "1.29.0"

[settings]
aqua.cosign = true
github_attestations = true
locked_verify_provenance = true
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64"]
minimum_release_age = "0d"
slsa = true

[settings.task]
quiet = true
run_auto_install = false

[tasks.all]
alias = "a"
description = "Check, test, and build without rewriting source files"
run = ["mise run check", "mise run test", "mise run build"]

[tasks.benchmark]
description = "Time record writes, cache builds and retrieval over a deterministic 20k-record corpus"
run = "uv run --locked python scripts/benchmark_scale.py"

[tasks.build]
alias = "b"
description = "Build and verify the wheel and source distribution"
run = ["uv sync --locked", "uv build --clear", "mise run test:package"]

[tasks.check]
alias = "c"
description = "Run every static check in parallel"
depends = [
  "check:actions",
  "check:changelog",
  "check:docs",
  "check:format",
  "check:leaks",
  "check:links",
  "check:lint",
  "check:notices",
  "check:scan",
  "check:schema",
  "check:screenshot",
  "check:shell",
  "check:types",
  "check:vuln",
]

[tasks."check:actions"]
description = "Validate GitHub Actions and Dependabot configuration"
run = [
  "actionlint",
  "zizmor --offline --persona=pedantic .github/workflows",
  "zizmor --offline --collect dependabot --strict-collection .",
]

[tasks."check:changelog"]
description = "Check that CHANGELOG.md has exactly one nonempty section for the project version"
run = 'scripts/release-notes.sh "v$(uv version --short)" > /dev/null'

[tasks."check:docs"]
description = "Build strict documentation and check rendered links and anchors"
run = [
  "mise run docs:build",
  'lychee --offline --include-fragments --index-files index.html --root-dir "$PWD/site" --no-progress "site/brain-framework/**/*.html"',
]

[tasks."check:format"]
alias = "cf"
description = "Check Python, metadata, lockfile, markup, and whitespace formatting"
run = [
  "uv lock --check",
  "uv run --locked validate-pyproject pyproject.toml",
  "uv run --locked ruff format --check",
  "dprint check",
  "git diff --check \"$(git hash-object -t tree /dev/null)\"",
]

[tasks."check:leaks"]
alias = "cs"
description = "Scan recent commits and the working tree for secrets"
run = [
  # Every scan skips the ignored generated directories, so Git must track no ignored file, including a force-staged one.
  # Only the repository's .gitignore files count, as in CI, not a contributor's global excludes.
  "! git ls-files -ci --exclude-per-directory=.gitignore | grep .",
  "mise run check:leaks:history",
  "gitleaks dir . --redact=100 --verbose --no-banner",
]

[tasks."check:leaks:history"]
description = "Scan the last 100 commits for secrets"
run = "gitleaks git --redact=100 --log-opts=--max-count=100 --verbose --no-banner"

[tasks."check:leaks:staged"]
description = "Scan the staged snapshot for secrets"
run = "gitleaks git --staged --redact=100 --verbose --no-banner"

[tasks."check:links"]
description = "Check repository Markdown links; check:docs owns documentation links"
run = "lychee --offline --no-progress --hidden --extensions md --exclude-path '(^|/)docs/' ."

[tasks."check:lint"]
alias = "cl"
description = "Lint application, tests, and shipped Python helpers (Ruff)"
run = "uv run --locked ruff check"

[tasks."check:notices"]
description = "Verify third-party notices and site license copies match the synced dependencies"
run = "uv run --locked python scripts/notices.py"

[tasks."check:outdated"]
description = "Report drift in pinned mise tools and dprint plugins without failing the gate"
run = [
  # Lists drift and exits 0; an error, such as an unreachable registry, still fails the task.
  "mise outdated --local --bump",
  # Honors the seven-day cooldown and names any newer release it holds back.
  "dprint config update --dry-run --minimum-dependency-age P7D",
]

[tasks."check:scan"]
description = "Scan the repository for vulnerabilities, secrets, licenses, and misconfigurations"
run = "trivy --config trivy.yaml fs ."

[tasks."check:schema"]
description = "Verify every published configuration and reply schema matches its source"
run = "uv run --locked python scripts/schemas.py"

[tasks."check:screenshot"]
description = "Verify the published watch screenshot matches the dashboard"
run = "uv run --locked python scripts/render_watch.py"

[tasks."check:shell"]
description = "Lint every shipped and release shell helper"
run = "shellcheck -S warning scripts/push-and-tag.sh scripts/release-notes.sh scripts/verify-release-tag.sh scripts/verify-release.sh"

[tasks."check:types"]
alias = "ct"
description = "Type-check Python sources (ty)"
run = "uv run --locked ty check"

[tasks."check:vuln"]
alias = "cv"
description = "Scan locked Python dependencies for known vulnerabilities"
run = "uv audit --preview-features audit-command --locked"

[tasks.clean]
alias = "n"
description = "Remove generated build, test, and documentation output"
run = "rm -rf dist site .cache .coverage .coverage.* htmlcov .pytest_cache .ruff_cache"

[tasks.coverage]
alias = "v"
description = "Write an HTML branch-coverage report"
depends = ["test"]
run = "uv run --locked coverage html"

[tasks."docs:build"]
description = "Build the documentation site into site/brain-framework"
run = "uv run --locked zensical build --clean --strict"

[tasks."docs:watch"]
alias = "w"
description = "Serve the documentation site locally with live reload"
run = "uv run --locked zensical serve"

[tasks.format]
alias = "f"
description = "Format Python, JSON, Markdown, TOML, and YAML"
run = ["mise run format:imports", "mise run format:python", "mise run format:dprint"]

[tasks."format:dprint"]
description = "Format JSON, Markdown, TOML, and YAML"
run = "dprint fmt --allow-no-files"

[tasks."format:python"]
description = "Format Python sources"
run = "uv run --locked ruff format --force-exclude"

[tasks."format:imports"]
description = "Sort Python imports"
run = "uv run --locked ruff check --select=I --fix --force-exclude"

[tasks."generate:schema"]
description = "Generate and format all configuration and reply schemas"
run = [
  "uv run --locked python scripts/schemas.py --write",
  "dprint fmt docs/*.schema.json",
]

[tasks."generate:notices"]
description = "Regenerate third-party notices and site license copies from the synced dependencies"
run = [
  "uv run --locked python scripts/notices.py --write",
  "dprint fmt THIRD_PARTY_NOTICES.md docs/third-party-notices.md",
]

[tasks."generate:screenshot"]
description = "Render the watch screenshot from the fictional offline demo"
run = "uv run --locked python scripts/render_watch.py --write"

[tasks.install]
alias = "i"
description = "Sync locked dependencies and install Git hooks"
run = ["uv sync --locked", "lefthook install"]

[tasks.test]
alias = "t"
description = "Run isolated tests with at least 95% branch coverage"
# Tests pin UTC themselves; the variable also covers Python builds without time.tzset.
env.TZ = "UTC"
run = "uv run --locked pytest -q --cov --cov-report="

[tasks."report:coverage"]
description = "Show per-file coverage and missing lines from the last test run"
run = "uv run --locked coverage report --show-missing"

[tasks."test:package"]
description = "Smoke-test the wheel and source distribution outside the checkout"
run = "uv run --locked python scripts/test_package.py"

[tasks."test:watch"]
alias = "tw"
description = "Run the test suite in watch mode"
env.TZ = "UTC"
run = "uv run --locked pytest-watcher ."

[tasks.upgrade]
alias = "u"
description = "Upgrade dependencies to latest compatible versions"
run = "uv sync --upgrade"
