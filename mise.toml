# https://mise.jdx.dev/configuration.html
[tools]
actionlint = "1.7.12"
dprint = "0.57.4"
gitleaks = "8.30.1"
jq = "1.8.2"
lefthook = "2.1.12"
lychee = "0.24.2"
opengrep = "1.29.0"
python = "3.14.7"
shellcheck = "0.11.0"
trivy = "0.74.0"
"aqua:astral-sh/uv" = "0.12.10"
yq = "4.53.6"
# 1.30 requires GitHub's new $/ self-reference, which actionlint 1.7.12 cannot parse yet
# (rhysd/actionlint#711). Keep both strict gates warning-free rather than suppressing either.
zizmor = "1.29.0"

[settings]
aqua.cosign = true
github_attestations = true
locked_verify_provenance = true
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64"]
minimum_release_age = "0d"
slsa = true

[settings.task]
run_auto_install = false

[tasks.all]
alias = "a"
description = "Format, check, test, and build the project"
run = ["mise run format", "mise run check", "mise run test", "mise run build"]

[tasks.benchmark]
description = "Observe build and retrieval latency over a deterministic 20k-record corpus"
run = "uv run python scripts/benchmark_scale.py"

[tasks.build]
alias = "b"
description = "Build and verify the wheel and source distribution"
run = ["uv sync --locked", "rm -rf dist", "uv build --wheel --sdist", "mise run test:package"]

[tasks.check]
alias = "c"
description = "Run every static check in parallel"
depends = [
  "check:actions",
  "check:docs",
  "check:format",
  "check:leaks",
  "check:links",
  "check:lint",
  "check:sast",
  "check:scan",
  "check:schema",
  "check:shell",
  "check:types",
  "check:vuln",
]

[tasks."check:actions"]
description = "Validate GitHub Actions and Dependabot configuration"
run = [
  "actionlint",
  "zizmor --offline --persona=pedantic .github/workflows",
  "zizmor --offline --collect dependabot --strict-collection .",
]

[tasks."check:docs"]
description = "Build the documentation site strictly and verify every rendered link"
shell = "bash -c"
run = [
  "uv run zensical build --clean --strict",
  '''
uv run python - <<'PY'
from html.parser import HTMLParser
from pathlib import Path

class SkipLinks(HTMLParser):
    def __init__(self):
        super().__init__()
        self.ids = set()
        self.targets = []
        self.focusable = set()

    def handle_starttag(self, tag, attributes):
        attributes = dict(attributes)
        if attributes.get("id"):
            self.ids.add(attributes["id"])
            if attributes.get("tabindex") == "-1":
                self.focusable.add(attributes["id"])
        if tag == "a" and "md-skip" in attributes.get("class", "").split():
            self.targets.append(attributes.get("href", "").removeprefix("#"))

site = Path("site")
expected_pages = {
    "404.html",
    "docs/agents/index.html",
    "docs/brain/index.html",
    "docs/commands/index.html",
    "docs/getting-started/index.html",
    "docs/index.html",
    "docs/mcp/index.html",
    "docs/privacy/index.html",
    "docs/schema/index.html",
    "docs/search/index.html",
    "docs/sensors/index.html",
    "docs/team/index.html",
    "index.html",
    "third-party-notices/index.html",
}
required_assets = {
    "bf.schema.json",
    "fmind-logo.webp",
    "third-party/lucide-LICENSE.txt",
    "third-party/zensical-0.0.59-LICENSE.txt",
    "third-party/zensical-javascript-LICENSE.txt",
}
actual_pages = {path.relative_to(site).as_posix() for path in site.rglob("*.html")}
missing_assets = sorted(relative for relative in required_assets if not (site / relative).is_file())
if actual_pages != expected_pages or missing_assets:
    missing_pages = sorted(expected_pages - actual_pages)
    unexpected_pages = sorted(actual_pages - expected_pages)
    raise SystemExit(
        "documentation route contract failed: "
        f"missing_pages={missing_pages}, unexpected_pages={unexpected_pages}, "
        f"missing_assets={missing_assets}"
    )
missing_skip_targets = []
for relative in sorted(expected_pages):
    page = SkipLinks()
    page.feed((site / relative).read_text())
    missing_skip_targets.extend(f"{relative}#{target}" for target in page.targets if target not in page.ids)
    if relative == "404.html" and (page.targets != ["__skip"] or "__skip" not in page.focusable):
        raise SystemExit("404 page must provide a focusable skip-navigation target")
if missing_skip_targets:
    raise SystemExit(f"documentation skip targets missing: {missing_skip_targets}")
PY
''',
  '''
set -euo pipefail
bf_site_root=$(mktemp -d)
trap 'rm -rf "$bf_site_root"' EXIT
ln -s "$PWD/site" "$bf_site_root/brain-framework"
lychee --offline --root-dir "$bf_site_root" --no-progress 'site/**/*.html'
''',
]

[tasks."check:format"]
alias = "cf"
description = "Check Python, metadata, lockfile, markup, and whitespace formatting"
run = [
  "uv run validate-pyproject pyproject.toml",
  "uv run ruff format --check",
  "dprint check",
  "uv lock --check",
  "git diff --check \"$(git hash-object -t tree /dev/null)\"",
]

[tasks."check:leaks"]
alias = "cs"
description = "Audit staged changes or both recent commits and the working tree for leaked secrets"
run = """
sh -c '
if [ "$#" -gt 0 ]; then
  gitleaks git --redact=100 --verbose "$@"
elif git rev-parse --verify HEAD >/dev/null 2>&1; then
  gitleaks git --redact=100 --log-opts="--max-count=100" --verbose
  gitleaks dir . --redact=100 --verbose
else
  gitleaks dir . --redact=100 --verbose
fi
' --
"""

[tasks."check:links"]
description = "Validate links in the repository's own Markdown"
# Zensical validates documentation source links and anchors before lychee checks rendered output.
run = '''
bash -c '
set -euo pipefail
git ls-files -z --cached --others --exclude-standard -- "*.md" ":(exclude)docs/**" |
  while IFS= read -r -d "" path; do
    # The index still names unstaged deletions; only the existing working-tree set is reviewable.
    if [ -f "$path" ]; then
      printf "%s\0" "$path"
    fi
  done |
  xargs -0 lychee --offline --no-progress --
'
'''

[tasks."check:lint"]
alias = "cl"
description = "Lint application, tests, and shipped Python helpers (Ruff)"
run = "uv run ruff check"

[tasks."check:outdated"]
description = "Report drift in the pinned toolchain without failing the gate"
run = "mise outdated --local --bump || true"

[tasks."check:scan"]
description = "Scan the repository for vulnerabilities, secrets, licenses, and misconfigurations"
run = "trivy --config trivy.yaml fs ."

[tasks."check:sast"]
description = "Scan Python and workflow code for insecure patterns (opengrep)"
depends = ["install:sast"]
run = "opengrep scan --error --quiet --config .opengrep/rules/python/lang/security --config .opengrep/rules/yaml/github-actions/security ."

[tasks."check:schema"]
description = "Verify the committed JSON Schema matches the Python configuration loader"
shell = "bash -c"
run = '''
set -euo pipefail
schema=$(mktemp)
trap 'rm -f "$schema"' EXIT
uv run bf schema | jq -S . > "$schema"
jq -S . docs/bf.schema.json | diff -u - "$schema"
'''

[tasks."check:shell"]
description = "Lint every shipped and release shell helper"
run = "shellcheck -S warning scripts/release-notes scripts/verify-release-assets scripts/verify-release-tag scripts/install-sast.sh"

[tasks."check:types"]
alias = "ct"
description = "Type-check Python sources (ty)"
run = "uv run ty check"

[tasks."check:vuln"]
alias = "cv"
description = "Scan locked Python dependencies for known vulnerabilities"
run = "uv audit --preview-features audit-command --locked"

[tasks.clean]
alias = "n"
description = "Remove generated build, test, and documentation output"
run = "rm -rf dist site .cache .coverage htmlcov .pytest_cache .ruff_cache .ty"

[tasks.coverage]
alias = "v"
description = "Write an HTML branch-coverage report"
depends = ["test"]
run = "uv run coverage html"

[tasks."docs:build"]
description = "Build the production documentation site into site"
run = "uv run zensical build --clean --strict"

[tasks."docs:watch"]
alias = "w"
description = "Serve the documentation site locally with live reload"
run = "uv run zensical serve"

[tasks.format]
alias = "f"
description = "Format Python, JSON, Markdown, TOML, and YAML"
depends = ["format:dprint", "format:python"]

[tasks."format:dprint"]
description = "Format JSON, Markdown, TOML, and YAML"
run = "dprint fmt --allow-no-files"

[tasks."format:python"]
description = "Format Python sources and sort imports"
raw_args = true
run = """
bash -c '
set -euo pipefail
if [ "$#" -eq 0 ]; then set -- .; fi
uv run ruff check --select=I --fix --force-exclude "$@"
uv run ruff format --force-exclude "$@"
' --
"""

[tasks."generate:schema"]
description = "Rewrite the JSON Schema from the Python configuration loader atomically"
shell = "bash -c"
run = '''
set -euo pipefail
schema=$(mktemp docs/bf.schema.json.XXXXXX)
trap 'rm -f "$schema"' EXIT
uv run bf schema > "$schema"
mv "$schema" docs/bf.schema.json
dprint fmt docs/bf.schema.json
'''

[tasks.install]
alias = "i"
description = "Sync locked dependencies and install Git hooks"
run = ["uv sync --locked", "lefthook install"]

[tasks."install:sast"]
description = "Fetch the commit-pinned opengrep rules"
run = "bash scripts/install-sast.sh f1d2b562b414783763fd02a6ed2736eaed622efa"

[tasks.test]
alias = "t"
description = "Run the hermetic test suite with branch coverage"
shell = "bash -c"
run = '''
set -euo pipefail
bf_test_home=$(mktemp -d)
bf_test_home=$(cd "$bf_test_home" && pwd -P)
trap 'rm -rf "$bf_test_home"' EXIT
# Set TZ before Python starts: some macOS builds do not expose time.tzset().
env -u BF_BRAIN TZ=UTC HOME="$bf_test_home" XDG_STATE_HOME="$bf_test_home/state" XDG_CONFIG_HOME="$bf_test_home/config" \
  uv run pytest --basetemp="$bf_test_home/pytest" \
    --cov=bf --cov-branch --cov-report=term-missing --cov-fail-under=85
'''

[tasks."test:package"]
description = "Install and invoke the wheel and source distribution outside the checkout"
shell = "bash -c"
run = '''
set -euo pipefail
wheel_count=$(find dist -maxdepth 1 -type f -name 'brain_framework-*.whl' | wc -l)
sdist_count=$(find dist -maxdepth 1 -type f -name 'brain_framework-*.tar.gz' | wc -l)
[ "$wheel_count" -eq 1 ] && [ "$sdist_count" -eq 1 ] || {
  echo "expected exactly one brain-framework wheel and one source distribution" >&2
  exit 1
}
project_root=$PWD
wheel="$project_root/$(find dist -maxdepth 1 -type f -name 'brain_framework-*.whl')"
sdist="$project_root/$(find dist -maxdepth 1 -type f -name 'brain_framework-*.tar.gz')"
tmp=$(mktemp -d)
# macOS /var and user-supplied TMPDIR may be symlinks; private state needs the physical path.
tmp=$(cd "$tmp" && pwd -P)
trap 'rm -rf "$tmp"' EXIT
for distribution in wheel sdist; do
  uv venv --python 3.14 "$tmp/$distribution-venv"
  # Seed the exact locked runtime closure without installing the checkout.
  # Temporary smoke environments may be on another filesystem; copy without attempting hardlinks.
  VIRTUAL_ENV="$tmp/$distribution-venv" \
    uv sync --project "$project_root" --locked --offline --no-dev --no-install-project --active --link-mode copy
done
cd "$tmp"
uv pip install --offline --no-deps --link-mode copy --python "$tmp/wheel-venv/bin/python" "$wheel"
"$tmp/wheel-venv/bin/bf" --version
uv pip check --python "$tmp/wheel-venv/bin/python"
uv pip install --offline --no-deps --link-mode copy --python "$tmp/sdist-venv/bin/python" "$sdist"
"$tmp/sdist-venv/bin/bf" --version
uv pip check --python "$tmp/sdist-venv/bin/python"
# Exercise the installed CLI and derived reads in both artifacts, with no user brain or state.
for distribution in wheel sdist; do
  "$tmp/$distribution-venv/bin/python" - <<'PYTHON'
from importlib.metadata import distribution
from pathlib import Path
import bf

installed = distribution("brain-framework")
assert installed.metadata["Name"] == "brain-framework"
assert installed.version == bf.__version__
assert [(entry.name, entry.value) for entry in installed.entry_points] == [("bf", "bf:main")]
assert Path(bf.__file__).resolve().is_relative_to(Path.cwd())
PYTHON
  bf_package_home="$tmp/$distribution-home"
  mkdir "$bf_package_home"
  (
    unset BF_BRAIN
    export HOME="$bf_package_home" XDG_STATE_HOME="$bf_package_home/state"
    bf_package_bin="$tmp/$distribution-venv/bin/bf"
    export XDG_CONFIG_HOME="$bf_package_home/config"
    "$bf_package_bin" init "$tmp/$distribution-brain"
    test ! -e "$XDG_CONFIG_HOME/bf/config.yaml"
    cd "$tmp/$distribution-brain"
    "$bf_package_bin" validate --brain "$tmp/$distribution-brain"
    "$bf_package_bin" search welcome
    "$bf_package_bin" read concepts/welcome.md
    "$bf_package_bin" status --check
    mkdir -p "$tmp/$distribution-brain/evals"
    cat > "$tmp/$distribution-brain/evals/retrieval.yaml" <<'YAML'
version: 5
cases:
  - name: installed-welcome
    query: welcome
    expect: [concepts/welcome.md]
YAML
    "$bf_package_bin" eval

  )
done
'''

[tasks."test:watch"]
alias = "tw"
description = "Run the test suite in watch mode"
run = "uv run pytest-watcher ."

[tasks.upgrade]
alias = "u"
description = "Upgrade dependencies to latest compatible versions"
run = "uv sync --upgrade"

[tasks.watch]
description = "Run the Brain Framework CLI from the working tree"
run = "uv run bf"
