# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
name: Bug report
description: Report a reproducible problem without sharing anything a brain collected.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A brain holds real activity. Review and redact every line before pasting: no credentials, personal data, customer names, record content, private repository names, or home paths. Diagnostics can include source names, paths, record identifiers, and timestamps.
  - type: input
    id: command
    attributes:
      label: Command
      description: The command that misbehaved.
      placeholder: bf validate --brain /tmp/demo
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: The observed and the expected behavior, with synthetic examples.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: >-
        The smallest safe sequence using a synthetic brain. For ingestion failures, include the redacted schema and error. `bf ingest SOURCE --input sample.json --dry-run` validates records without writing; never paste private samples or logs.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Review or validation output
      description: Redacted output of `bf validate` or `bf review`.
      render: text
  - type: input
    id: version
    attributes:
      label: bf version
      placeholder: bf --version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS Apple Silicon
        - macOS Intel
        - Other
    validations:
      required: true
