# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
name: Bug report
description: Report a reproducible problem without sharing anything a base collected.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A base holds real activity. Review and redact every line before pasting: no credentials, personal data, customer names, record content, private repository names, or home paths. `fkf status` does not print whole records or command stdout, but diagnostics can include source names, paths, record identifiers, and timestamps.
  - type: input
    id: command
    attributes:
      label: Command
      description: The command that misbehaved.
      placeholder: fkf search "retention decision" --base example
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: What happened?
      description: The observed and the expected behaviour, with synthetic examples.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: >-
        The smallest safe sequence using a synthetic base. For collection failures, include the redacted source configuration and error. `fkf collect --dry-run` executes the collector and prints record samples; never paste private samples or logs.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Status output
      description: Redacted output of `fkf status`.
      render: text
  - type: input
    id: version
    attributes:
      label: fkf version
      placeholder: fkf --version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS Apple Silicon
        - macOS Intel
        - Other
    validations:
      required: true
