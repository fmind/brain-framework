# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
name: Feature request
description: Propose a focused improvement to collection, retrieval, or the agent surface.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the last concrete occurrence, for whom, how often it happens, and the current workaround. Use fictional replacements for private work.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The smallest useful change, the observable outcome, and how you would compare it with the current workflow or the same notes read directly.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: The proposal works on the supported Linux and macOS release targets.
          required: true
        - label: The proposal keeps a brain's contents private and reads no credential.
          required: true
