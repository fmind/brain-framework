# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  pages:
    name: Publish verified documentation
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write # Publish the artifact produced by the read-only gate.
      id-token: write # Authenticate the Pages deployment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read current main commit
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '"sha=" + .object.sha' >> "$GITHUB_OUTPUT"
      - name: Deploy documentation
        id: deployment
        if: steps.main.outputs.sha == github.sha
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
