# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Verify
on:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  check:
    name: Shared static, security and documentation checks
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100 # check:leaks scans the last 100 commits; a shallower clone hides them.
          persist-credentials: false
      - name: Install locked toolchain
        # jactionlint ignore=self-repository
        uses: ./.github/actions/setup-mise
      - name: Match release version to tag
        if: ${{ github.ref_type == 'tag' }}
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - name: Sync locked Python dependencies
        run: uv sync --locked
      - name: Run shared checks
        run: mise run check
      - name: List checkout changes
        run: git status --porcelain
      - name: Verify clean checkout
        run: status="$(git status --porcelain)" && test -z "$status"
      - name: Upload tested documentation
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/brain-framework
  verify:
    name: Verify Python package (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-26.04
          - target: linux-arm64
            runner: ubuntu-26.04-arm
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked toolchain
        # jactionlint ignore=self-repository
        uses: ./.github/actions/setup-mise
      - name: Run tests
        run: mise run test
      - name: Build and smoke-test distributions
        run: mise run build
      - name: List checkout changes
        run: git status --porcelain
      - name: Verify clean checkout
        run: status="$(git status --porcelain)" && test -z "$status"
      - name: Record distribution hashes
        if: ${{ matrix.target == 'linux-x64' && github.ref_type == 'tag' }}
        run: sha256sum dist/*.whl dist/*.tar.gz > python-package.sha256
      - name: Upload tested distributions
        if: ${{ matrix.target == 'linux-x64' && github.ref_type == 'tag' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            python-package.sha256
          if-no-files-found: error
          retention-days: 30
