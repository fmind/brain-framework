# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Verify
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    name: Verify Python package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100 # check:leaks scans the last 100 commits; a shallower clone hides them.
          persist-credentials: false
      - name: Install locked toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          cache: false # These artifacts can be published; never restore a PR cache.
      - name: Match release version to tag
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - name: Run canonical gate
        run: mise run all
      - name: Verify clean checkout
        run: test -z "$(git status --porcelain)"
      - name: Record distribution hashes
        if: matrix.target == 'linux-x64' && github.ref_type == 'tag'
        run: sha256sum dist/*.whl dist/*.tar.gz > python-package.sha256
      - name: Upload tested distributions
        if: matrix.target == 'linux-x64' && github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            python-package.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Upload tested documentation
        if: matrix.target == 'linux-x64' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/brain-framework
