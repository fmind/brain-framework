# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: CD
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify release commit
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
  publish_python_package:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/brain-framework
    permissions:
      contents: read # Check out the tag verifier without granting repository writes.
      id-token: write # Authenticate provenance and PyPI Trusted Publishing.
      attestations: write # Publish provenance for the tested distributions.
      artifact-metadata: write # Associate that provenance with repository artifacts.
    steps:
      - name: Checkout release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
      - name: Verify distribution hashes
        run: sha256sum --check --strict python-package.sha256
      - name: Verify distribution count
        run: test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Recheck remote tag before PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-release-tag
      - name: Attest distribution provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
      - name: Download PyPI release metadata
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 30 "https://pypi.org/pypi/brain-framework/${GITHUB_REF_NAME#v}/json" --output "$RUNNER_TEMP/pypi.json"
      - name: Extract published distribution hashes
        run: jq -r '.urls[] | "\(.digests.sha256)  dist/\(.filename)"' "$RUNNER_TEMP/pypi.json" | sort > published.sha256
      - name: Sort expected distribution hashes
        run: sort python-package.sha256 > expected.sha256
      - name: Compare published distributions
        run: diff -u expected.sha256 published.sha256
  publish_github_release:
    name: Publish GitHub release
    needs: publish_python_package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # Publish the already-attested draft after PyPI succeeds.
    steps:
      - name: Checkout release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
      - name: Verify distribution hashes
        run: sha256sum --check --strict python-package.sha256
      - name: Verify distribution count
        run: test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Recheck remote tag before GitHub publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-release-tag
      - name: Extract release notes
        run: scripts/release-notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --draft --verify-tag --prerelease="$PRERELEASE" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Download draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/release-assets"
      - name: Compare draft assets
        run: diff --recursive dist "$RUNNER_TEMP/release-assets"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --verify-tag
