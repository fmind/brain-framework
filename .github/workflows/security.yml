# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Security
# Push CI scans only recent history and audits workflows offline. This scheduled counterpart scans the complete
# repository, runs the online workflow audits and installs the package with the newest dependencies users would get.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security
  cancel-in-progress: true
jobs:
  scan:
    name: Full-history scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install locked toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.15
          cache: false # Like CI: scans and installation checks never restore a cache.
      - name: Scan complete Git history
        run: gitleaks git --redact=100 --verbose --no-banner
      - name: Scan full checkout
        run: mise run check:scan
      - name: Audit all locked Python dependencies
        run: mise run check:vuln
      - name: Audit workflows with online checks
        env:
          GH_TOKEN: ${{ github.token }} # Read-only API access for impostor-commit and known-vulnerability audits.
        run: zizmor --persona=pedantic .github/workflows
  install:
    name: Unlocked installation (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The next Python release too: requires-python has no upper bound, so users can install it there.
        python: ["3.14", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.15
          cache: false # Like CI: scans and installation checks never restore a cache.
      - name: Build distributions
        run: uv build --clear
      - name: Smoke-test distributions with the newest allowed dependencies
        run: uv run --locked python scripts/test_package.py --unlocked --python "$PYTHON"
        env:
          PYTHON: ${{ matrix.python }}
