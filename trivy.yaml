# https://trivy.dev/docs/latest/references/configuration/config-file/
severity:
  - HIGH
  - CRITICAL
exit-code: 1
scan:
  scanners:
    - license
    - misconfig
    - secret
    - vuln
vulnerability:
  # A CRITICAL with no patch available is exactly the finding that needs a decision, so it must
  # surface rather than be filtered out into a green run.
  ignore-unfixed: false
license:
  # Dependency and loose-file license checks stay visible in the same fail-closed scan.
  full: true
