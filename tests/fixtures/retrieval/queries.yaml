# https://fmind.github.io/fkf/
version: 1
cases:
  - name: default-budget-decision
    query: project:example
    expect: [wiki/decisions.md]
    excerpts:
      wiki/decisions.md: [Keep historical evidence]
    reads:
      wiki/decisions.md#retention: [Keep historical evidence in durable local files.]
  - name: late-passage-small-budget
    query: zirconium
    budget: 128
    expect: [wiki/long.md]
    excerpts:
      wiki/long.md: [Zirconium]
  - name: multilingual
    query: 検索では根拠を保持する
    expect: [wiki/decisions.md]
    excerpts:
      wiki/decisions.md: [検索では根拠を保持する]
  - name: latest-contradictory-capture
    query: decision:retention
    expect: [decision:retention]
    excerpts:
      decision:retention: [Keep durable originals]
    reads:
      decision:retention: [Keep durable originals]
  - name: absent-identity
    query: project:missing
    empty: true
  - name: undated-time-filter
    query: undated
    before: "2026-01-01T00:00:00Z"
    empty: true
