# https://fmind.github.io/brain-framework/docs/schedule/
version: 10
name: watch-demo
watch:
  interval: 5
  poll_interval: 1
  notifications: off
  notification_cooldown: 30
jobs:
  calendar:
    run: [python3, sensors/demo.py, calendar]
    emit: records
    mode: snapshot
    on:
      every: 30
  git:
    run: [python3, sensors/demo.py, git]
    emit: records
    mode: snapshot
    on:
      every: 60
  unavailable:
    run: [python3, sensors/demo.py, unavailable]
    emit: records
    on:
      every: 60
  manual:
    run: [python3, sensors/demo.py, calendar]
    emit: records
  disabled:
    run: [python3, sensors/demo.py, calendar]
    emit: records
    enabled: false
    on:
      every: 60
