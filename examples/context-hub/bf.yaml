# yaml-language-server: $schema=https://fmind.github.io/brain-framework/bf.schema.json
# https://fmind.github.io/brain-framework/reference/
version: 16
name: context-demo
description: Four-tool offline walkthrough (Workspace, Jira, GitHub, and Google Cloud).
loops:
  build:
    description: Compile Markdown notes into memories/.
    on:
      hooks: pre-commit
    run: [bf, build]
  check:
    description: Validate schemas, notes, records, and links.
    on:
      hooks: pre-commit
    run: [bf, check, --validate]
