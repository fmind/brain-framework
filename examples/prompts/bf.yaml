# https://fmind.github.io/brain-framework/docs/prompts/
version: 8
name: prompt-demo
assistants:
  assistant:
    prompt: prompts/assistant.md
    # A stand-in harness: cat prints the expanded prompt it receives on standard input, offline.
    command: [cat]
    # No schedules or inputs: this assistant runs only through bf run.
    timeout: 60
