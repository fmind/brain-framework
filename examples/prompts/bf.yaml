# https://fmind.github.io/brain-framework/docs/prompts/
version: 10
name: prompt-demo
defaults:
  post: inbox
jobs:
  inbox:
    run:
      [
        printf,
        '{"messages":[{"id":"m1","sender":"fictional-owner","conversation":"t1","time":"%s","text":"Approve launch"}]}',
        "{{start}}",
      ]
    emit: messages
    on: { every: 1s }
    send: [printf, '{"id":"sent-1","conversation":"t1"}']
  assistant:
    prompt: prompts/assistant.md
    # A stand-in harness: cat prints the expanded prompt it receives on standard input, offline.
    harness: [cat]
    # No on triggers: runs manually with bf run assistant.
    emit: log
    timeout: 60s
  triage:
    prompt: prompts/assistant.md
    harness: [echo, handled]
    emit: message
    on:
      - { every: 1d }
      - { event: { kind: [message.received, channel.received], source: inbox } }
