# https://fmind.github.io/brain-framework/docs/channels/
version: 10
name: channel-demo
jobs:
  local:
    run: [python3, channels/local.py, stream]
    emit: messages
    on: { daemon: true }
    send: [python3, channels/local.py, send]
  local-poll:
    run: [python3, channels/local.py, read, "{{start}}", "{{end}}"]
    emit: messages
  # The walkthrough's scout posts its proposals here, and its actor reads the owner's reply.
  owner-chat:
    run:
      [
        printf,
        '{"messages":[{"id":"reply-1","sender":"fictional-owner","conversation":"proactive-thread","time":"%s","text":"do 2"}]}',
        "{{start}}",
      ]
    emit: messages
    on: { every: 1s }
    send: [python3, channels/local.py, send]
  personal:
    prompt: prompts/personal.md
    # A deterministic stand-in for an agent CLI; no model or network access.
    harness: [printf, "Acknowledged."]
    emit: message
    post: local
    on:
      - { every: 30m }
      - { event: { kind: [channel.received, message.received], source: local } }
