# https://fmind.github.io/brain-framework/docs/search/
version: 5
cases:
  - name: retention-concept
    query: why keep original evidence
    scope: concepts
    expect: [concepts/retention.md]
    text: [upstream content can disappear]
  - name: retention-record
    query: retention decision
    scope: memories/demo
    expect: ["demo:retention"]
  - name: project-by-identity
    query: "repo:example/project"
    expect: [projects/example.md, "demo:retention"]
  - name: absent-evidence
    query: nonexistent-quasar
    empty: true
  - name: explicit-repository-relationship
    read: "repo:example/project"
    expect: ["demo:retention"]
    text: [repository]
  - name: explicit-concept-backlink
    read: bf://example/concepts/retention.md
    expect: [projects/example.md]
    text: [related-to]
  - name: active-projects
    read: projects
    expect: [projects/example.md]
  - name: resume-the-action
    read: actions/2026-09-19_retention
    expect: [projects/example.md]
    text: [Next action]
  - name: compact-working-context
    read: actions/2026-09-25_retention-review/ACTION.md#context
    text: [capture only selected evidence]
  - name: changed-policy-dependency
    read: bf://example/concepts/archive-policy.md
    expect: [actions/2026-09-25_retention-review/outputs/decision.md]
    text: [depends-on]
  - name: superseded-prediction
    read: actions/2026-09-25_retention-review/outputs/prior-decision.md
    text: [unverified belief, prediction is missed, supersedes]
  - name: prospective-intention
    read: projects/example.md#intention
    text: [State, waiting, unknown]
  - name: material-unknown
    read: projects/example.md#unknown
    text: [storage cost, unresolved]
  - name: provisional-procedure
    read: concepts/selected-evidence.md
    text: [draft, separate synthetic case, No verification]
