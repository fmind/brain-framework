# yaml-language-server: $schema=https://fmind.github.io/brain-framework/bf.schema.json
# https://fmind.github.io/brain-framework/reference/
version: 19
name: example
description: Runnable example brain with offline sensors, routines, and loops.
timezone: UTC
concurrency:
  default: 4
  agents: 2
  interactive: 2
env:
  EXAMPLE_MODE: "local"
loops:
  demo:
    description: Snapshot fictional evidence records from the local demo sensor.
    when: 1h
    ingest: snapshot
  usage-demo:
    description: Snapshot fictional FinOps telemetry records into memories/usage-demo.jsonl with schemas/usages.json.
    when: 1d
    ingest:
      mode: snapshot
      schema: usages
  weekly-review:
    description: Save a weekly summary of notes, records, and open tasks into memories/weekly-review.jsonl.
    when: "0 8 * * 0"
    ingest: snapshot
  local:
    description: Stream local inbox messages as loop.message events.
    when: daemon
    run: [python3, routines/local.py, listen]
    emit: loop.message
    enabled: false
  assistant:
    description: Run a scheduled or chat-triggered digest assistant (agents/assistant.py).
    pool: agents
    timeout: 15m
    window:
      backfill: 1d
    when:
      - 1d
      - cron: "0 8 * * 1"
        backfill: 1w
      - event:
          kind: loop.message
          source: local
    enabled: false
