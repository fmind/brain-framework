# yaml-language-server: $schema=schemas/bf.schema.json
# https://fmind.github.io/brain-framework/reference/
version: 14
name: example
timezone: UTC
env:
  EXAMPLE_MODE: "local"
jobs:
  demo:
    run: [python3, sensors/demo.py, "{{start}}", "{{end}}"]
    ingest:
      source: demo
      mode: snapshot
    schedule: 1h
  build:
    run: [bf, build]
    hook: pre-commit
    events:
      - kind: records.ingested
        source: demo
  weekly-review:
    run: [python3, routines/weekly-review.py]
    action:
      keep: 4
    schedule: "0 8 * * 0"
  assistant:
    run: [claude, -p, "Context file: {{context}}"]
    input: prompts/digest.md
    events:
      - kind: service.message
        source: local
    enabled: false
  validate:
    run: [bf, validate]
    hook: pre-commit
services:
  local:
    run: [python3, services/local.py, listen]
    emit: messages
    enabled: false
watch:
  interval: 5s
  debounce: 300ms
