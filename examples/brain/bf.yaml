# yaml-language-server: $schema=https://fmind.github.io/brain-framework/bf.schema.json
# https://fmind.github.io/brain-framework/reference/
version: 15
name: example
timezone: UTC
env:
  EXAMPLE_MODE: "local"
loops:
  demo:
    run: [python3, sensors/demo.py, "{{start}}", "{{end}}"]
    ingest:
      source: demo
      mode: snapshot
    schedule: 1h
  build:
    run: [bf, build]
    hook: pre-commit
    events:
      - kind: records.ingested
        source: demo
  weekly-review:
    run: [python3, routines/weekly-review.py]
    action:
      keep: 4
    schedule: "0 8 * * 0"
  local:
    run: [python3, loops/local.py, listen]
    daemon: true
    emit: loop.message
    enabled: false
  assistant:
    run: [claude, -p, "Context file: {{context}}"]
    input: prompts/digest.md
    schedule:
      - 1d
      - "0 8 * * 1"
    events:
      - kind: loop.message
        source: local
    enabled: false
  validate:
    run: [bf, validate]
    hook: pre-commit
watch:
  interval: 5s
  debounce: 300ms
  concurrency: 4
