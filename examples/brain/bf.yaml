# yaml-language-server: $schema=schemas/bf.schema.json
# https://fmind.github.io/brain-framework/reference/
version: 12
name: example
defaults:
  timezone: UTC
  env:
    EXAMPLE_MODE: "local"
jobs:
  demo:
    run: [python3, sensors/demo.py, "{{start}}", "{{end}}"]
    ingest:
      source: demo
      mode: snapshot
    every: 1h
  build:
    builtin: build
    events:
      - kind: records.ingested
        source: demo
  weekly-review:
    run: [python3, routines/weekly-review.py]
    emit: action
    at: "08:00"
    days: [sun]
    keep: 4
  assistant:
    run: [claude, -p, "Context file: {{context}}"]
    input: prompts/digest.md
    events:
      - kind: channel.message
        source: local
    channel: local
    enabled: false
  validate:
    builtin: validate
    hook: pre-commit
channels:
  local:
    listen: [python3, channels/local.py, listen]
    send: [python3, channels/local.py, send]
servers:
  mcp:
    run: [bf, mcp, --transport, http, --port, "8765"]
    enabled: false
watch:
  interval: 5s
  debounce: 300ms
