<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">An agent opened anywhere versus an agent opened in your brain</title>
<desc id="desc">Two fictional terminal sessions ask whether the new website can launch. Opened anywhere, the agent has no access to Jira, GitHub or Google Cloud and asks you to paste them. Opened in a brain, it reads project:new-website, finds four records from four tools and answers: not yet, the pull request is merged and the preview is healthy, but Jira still blocks launch on accessibility review, citing each record.</desc>
<defs>
<style>
text { font-family: "Google Sans", "Google Sans Text", Roboto, "Segoe UI", Helvetica, Arial, sans-serif; fill: #202124; }
.code { font-family: "Google Sans Code", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13.5px; }
.title { font-size: 14px; font-weight: 700; }
.prompt { fill: #595D62; }
.ask { fill: #174EA6; font-weight: 700; }
.tool { fill: #595D62; }
.ref { fill: #681DA8; }
.point { font-size: 14px; }
.bad { fill: #A50E0E; font-weight: 700; }
.good { fill: #0D652D; font-weight: 700; }
</style>
</defs>
<rect x="1" y="1" width="958" height="398" rx="16" fill="#FFFFFF" stroke="#DADCE0"/>

<!-- Anywhere -->
<rect x="20" y="20" width="450" height="360" rx="12" fill="#FFFFFF" stroke="#DADCE0"/>
<path d="M20 52 V32 A12 12 0 0 1 32 20 H458 A12 12 0 0 1 470 32 V52 Z" fill="#F1F3F4"/>
<circle cx="40" cy="36" r="5" fill="#EA4335"/><circle cx="56" cy="36" r="5" fill="#FBBC04"/><circle cx="72" cy="36" r="5" fill="#34A853"/>
<text class="title" x="245" y="41" text-anchor="middle">Agent opened anywhere</text>
<text class="code" x="40" y="84"><tspan class="prompt">$</tspan> cd ~/projects &amp;&amp; claude</text>
<text class="code ask" x="40" y="112">&gt; Can the new website launch?</text>
<text class="code" x="40" y="140"><tspan fill="#9AA0A6">●</tspan> I have no access to your Jira, GitHub</text>
<text class="code" x="58" y="161">or Google Cloud. Can you paste the</text>
<text class="code" x="58" y="182">launch review, the pull request and</text>
<text class="code" x="58" y="203">the deployment status?</text>
<line x1="40" y1="288" x2="450" y2="288" stroke="#F1F3F4" stroke-width="2"/>
<text class="point" x="40" y="314"><tspan class="bad">✗</tspan>  Starts blank: you paste the context</text>
<text class="point" x="40" y="340"><tspan class="bad">✗</tspan>  Queries the same APIs every session</text>
<text class="point" x="40" y="366"><tspan class="bad">✗</tspan>  Forgets its conclusion when it ends</text>

<!-- Brain -->
<rect x="490" y="20" width="450" height="360" rx="12" fill="#FFFFFF" stroke="#174EA6" stroke-width="2"/>
<path d="M491 52 V32 A11 11 0 0 1 502 21 H928 A11 11 0 0 1 939 32 V52 Z" fill="#D2E3FC"/>
<circle cx="510" cy="36" r="5" fill="#EA4335"/><circle cx="526" cy="36" r="5" fill="#FBBC04"/><circle cx="542" cy="36" r="5" fill="#34A853"/>
<text class="title" x="715" y="41" text-anchor="middle">Agent opened in your brain</text>
<text class="code" x="510" y="84"><tspan class="prompt">$</tspan> cd ~/brain &amp;&amp; claude</text>
<text class="code ask" x="510" y="112">&gt; Can the new website launch?</text>
<text class="code tool" x="510" y="140"><tspan fill="#9AA0A6">●</tspan> bf read project:new-website</text>
<text class="code tool" x="528" y="161">4 records: workspace, jira, github, gcloud</text>
<text class="code" x="510" y="189"><tspan fill="#34A853">●</tspan> Not yet. The pull request is merged and</text>
<text class="code" x="528" y="210">the preview is healthy, but Jira still</text>
<text class="code" x="528" y="231">blocks launch on accessibility review.</text>
<text class="code" x="528" y="252">Evidence: <tspan class="ref">jira:review</tspan>, <tspan class="ref">github:implementation</tspan>,</text>
<text class="code ref" x="528" y="273">gcloud:deployment</text>
<line x1="510" y1="288" x2="920" y2="288" stroke="#F1F3F4" stroke-width="2"/>
<text class="point" x="510" y="314"><tspan class="good">✓</tspan>  Starts from your projects and evidence</text>
<text class="point" x="510" y="340"><tspan class="good">✓</tspan>  Cites the record behind each claim</text>
<text class="point" x="510" y="366"><tspan class="good">✓</tspan>  Writes the outcome back for next time</text>
</svg>
