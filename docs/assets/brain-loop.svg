<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">The Brain Framework loop</title>
<desc id="desc">Five steps run in a loop: gather, normalize, connect, act and learn. Sensors gather evidence from your tools into a brain folder on your computer. bf.yaml declares the ontology, sensors, routines and watch settings; memories, projects, concepts and actions form a knowledge graph. Agents such as Claude Code, Codex, GitHub Copilot and Antigravity read that context, act through the same CLIs, APIs, MCP servers and browsers, then write outcomes back to the brain.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#174EA6"/></marker>
<style>
text { font-family: "Google Sans", "Google Sans Text", Roboto, "Segoe UI", Helvetica, Arial, sans-serif; fill: #202124; }
.code { font-family: "Google Sans Code", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #595D62; }
.chip { fill: #F1F3F4; }
.chip-text { font-size: 14px; }
.muted { font-size: 12.5px; fill: #595D62; }
.folder { font-size: 14px; font-weight: 700; fill: #174EA6; }
.step { fill: #174EA6; }
.step-text { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
.verb { font-size: 13px; font-weight: 700; fill: #174EA6; }
.flow { fill: none; stroke: #174EA6; stroke-width: 2; }
.edge { stroke: #4285F4; stroke-width: 1.5; }
</style>
</defs>
<rect x="1" y="1" width="958" height="478" rx="16" fill="#FFFFFF" stroke="#DADCE0"/>

<!-- Tools -->
<text class="label" x="144" y="44" text-anchor="middle">YOUR TOOLS</text>
<g text-anchor="middle">
<rect class="chip" x="32" y="64" width="224" height="34" rx="17"/><text class="chip-text" x="144" y="86">Mail · Calendar · Meetings</text>
<rect class="chip" x="32" y="106" width="224" height="34" rx="17"/><text class="chip-text" x="144" y="128">Docs · Drive · Chat</text>
<rect class="chip" x="32" y="148" width="224" height="34" rx="17"/><text class="chip-text" x="144" y="170">GitHub · Jira · Alerts</text>
<rect class="chip" x="32" y="190" width="224" height="34" rx="17"/><text class="chip-text" x="144" y="212">Cloud · Deployments</text>
<rect class="chip" x="32" y="232" width="224" height="34" rx="17"/><text class="chip-text" x="144" y="254">Releases · Advisories</text>
<rect class="chip" x="32" y="274" width="224" height="34" rx="17"/><text class="chip-text" x="144" y="296">Domains · Mentions · Traffic</text>
<rect class="chip" x="32" y="316" width="224" height="34" rx="17"/><text class="chip-text" x="144" y="338">Feeds · Bookmarks</text>
<rect class="chip" x="32" y="358" width="224" height="34" rx="17"/><text class="chip-text" x="144" y="380">Agent sessions · Local files</text>
</g>

<!-- 1 Gather -->
<circle class="step" cx="288" cy="186" r="11"/><text class="step-text" x="288" y="190.5" text-anchor="middle">1</text>
<text class="verb" x="288" y="216" text-anchor="middle">gather</text>
<line class="flow" x1="262" y1="230" x2="314" y2="230" marker-end="url(#arrow)"/>
<text class="muted" x="288" y="254" text-anchor="middle">sensors</text>

<!-- Brain -->
<text class="label" x="480" y="44" text-anchor="middle">YOUR BRAIN · A FOLDER YOU OWN</text>
<rect x="320" y="60" width="320" height="336" rx="14" fill="#FFFFFF" stroke="#174EA6" stroke-width="2"/>
<rect x="340" y="78" width="280" height="56" rx="10" fill="#FEEFC3" stroke="#E37400"/>
<text class="code" x="480" y="101" text-anchor="middle" style="font-size:15px;font-weight:700">bf.yaml</text>
<text class="muted" x="480" y="122" text-anchor="middle">ontology · sensors · routines · watch</text>
<rect x="353" y="70" width="76" height="16" fill="#FFFFFF"/><text class="verb" x="357" y="82.5">normalize</text>
<circle class="step" cx="340" cy="78" r="11"/><text class="step-text" x="340" y="82.5" text-anchor="middle">2</text>
<g text-anchor="middle">
<rect x="340" y="148" width="134" height="54" rx="10" fill="#D2E3FC"/><text class="code folder" x="407" y="170">memories/</text><text class="muted" x="407" y="190">evidence records</text>
<rect x="486" y="148" width="134" height="54" rx="10" fill="#D2E3FC"/><text class="code folder" x="553" y="170">projects/</text><text class="muted" x="553" y="190">goals · decisions</text>
<rect x="340" y="212" width="134" height="54" rx="10" fill="#D2E3FC"/><text class="code folder" x="407" y="234">concepts/</text><text class="muted" x="407" y="254">reusable lessons</text>
<rect x="486" y="212" width="134" height="54" rx="10" fill="#D2E3FC"/><text class="code folder" x="553" y="234">actions/</text><text class="muted" x="553" y="254">work sessions</text>
</g>
<g>
<line class="edge" x1="480" y1="320" x2="404" y2="298"/>
<line class="edge" x1="480" y1="320" x2="412" y2="344"/>
<line class="edge" x1="480" y1="320" x2="556" y2="296"/>
<line class="edge" x1="480" y1="320" x2="548" y2="346"/>
<line class="edge" x1="404" y1="298" x2="412" y2="344"/>
<line class="edge" x1="556" y1="296" x2="600" y2="322"/>
<line class="edge" x1="548" y1="346" x2="600" y2="322"/>
<line class="edge" x1="480" y1="320" x2="480" y2="284"/>
<circle cx="480" cy="320" r="10" fill="#174EA6"/>
<circle cx="404" cy="298" r="6" fill="#FFFFFF" stroke="#174EA6" stroke-width="2"/>
<circle cx="412" cy="344" r="6" fill="#FFFFFF" stroke="#174EA6" stroke-width="2"/>
<circle cx="556" cy="296" r="6" fill="#FFFFFF" stroke="#174EA6" stroke-width="2"/>
<circle cx="548" cy="346" r="6" fill="#FFFFFF" stroke="#174EA6" stroke-width="2"/>
<circle cx="600" cy="322" r="6" fill="#FFFFFF" stroke="#174EA6" stroke-width="2"/>
<circle cx="480" cy="284" r="6" fill="#FFFFFF" stroke="#174EA6" stroke-width="2"/>
</g>
<circle class="step" cx="352" cy="314" r="11"/><text class="step-text" x="352" y="318.5" text-anchor="middle">3</text>
<text class="verb" x="352" y="344" text-anchor="middle">connect</text>
<text class="muted" x="480" y="380" text-anchor="middle">knowledge graph · offline search · Git</text>

<!-- Context and learn -->
<line class="flow" x1="644" y1="170" x2="700" y2="170" marker-end="url(#arrow)"/>
<text class="muted" x="672" y="158" text-anchor="middle">search</text>
<text class="muted" x="672" y="190" text-anchor="middle">read</text>
<line class="flow" x1="700" y1="270" x2="644" y2="270" marker-end="url(#arrow)"/>
<circle class="step" cx="672" cy="246" r="11"/><text class="step-text" x="672" y="250.5" text-anchor="middle">5</text>
<text class="verb" x="672" y="292" text-anchor="middle">learn</text>
<text class="muted" x="672" y="308" text-anchor="middle">write back</text>

<!-- Agents -->
<text class="label" x="816" y="44" text-anchor="middle">YOUR AGENTS</text>
<g text-anchor="middle">
<rect class="chip" x="704" y="106" width="224" height="34" rx="17"/><text class="chip-text" x="816" y="128">Claude Code</text>
<rect class="chip" x="704" y="148" width="224" height="34" rx="17"/><text class="chip-text" x="816" y="170">Codex</text>
<rect class="chip" x="704" y="190" width="224" height="34" rx="17"/><text class="chip-text" x="816" y="212">GitHub Copilot</text>
<rect class="chip" x="704" y="232" width="224" height="34" rx="17"/><text class="chip-text" x="816" y="254">Antigravity</text>
<rect class="chip" x="704" y="274" width="224" height="34" rx="17"/><text class="chip-text" x="816" y="296">Your own agent</text>
</g>
<text class="muted" x="816" y="66" text-anchor="middle">bf CLI · skills · MCP</text>

<!-- 4 Act -->
<path class="flow" d="M816 312 V440 H144 V400" marker-end="url(#arrow)"/>
<rect x="250" y="428" width="460" height="24" fill="#FFFFFF"/>
<circle class="step" cx="266" cy="440" r="11"/><text class="step-text" x="266" y="444.5" text-anchor="middle">4</text>
<text x="286" y="445" style="font-size:14px"><tspan class="verb" style="font-size:14px">act</tspan> through the same CLIs, APIs, MCP servers and browsers</text>
</svg>
