<svg xmlns="http://www.w3.org/2000/svg" width="960" height="372" viewBox="0 0 960 372" role="img" aria-labelledby="title desc">
<title id="title">When evidence moves on, BF flags the conclusion</title>
<desc id="desc">Four steps from the four-tool demo. A sensor collects the Jira review in status In review, and you record in projects/new-website.md that public launch is on hold. The review then moves to Done upstream; bf collect jira reports one updated record. bf read project:new-website flags the project with review true, the reason newer_evidence and the newer record jira:review. You read the record and update the conclusion: launch is no longer blocked, the next actions change and the review flag clears.</desc>
<defs>
<style>
text { font-family: "Google Sans", "Google Sans Text", Roboto, "Segoe UI", Helvetica, Arial, sans-serif; fill: #202124; }
.code { font-family: "Google Sans Code", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #595D62; }
.title { font-size: 14.5px; font-weight: 700; }
.caption { font-size: 12.5px; fill: #595D62; }
.path { font-size: 11px; fill: #595D62; }
.note { font-size: 13px; }
.key { fill: #934900; }
.muted { fill: #595D62; }
.wait { fill: #934900; }
.ok { fill: #0D652D; }
.flag { fill: #A50E0E; }
.step-text { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
.card { fill: #FFFFFF; stroke: #DADCE0; }
.box { fill: #F1F3F4; }
.done { font-size: 13px; fill: #0D652D; font-weight: 700; }
</style>
</defs>
<rect x="1" y="1" width="958" height="370" rx="16" fill="#FFFFFF" stroke="#DADCE0"/>
<text class="label" x="480" y="36" text-anchor="middle">WHEN EVIDENCE MOVES ON, BF FLAGS THE CONCLUSION</text>

<!-- Timeline -->
<line x1="132" y1="70" x2="828" y2="70" stroke="#DADCE0" stroke-width="2"/>
<circle cx="132" cy="70" r="13" fill="#174EA6"/><text class="step-text" x="132" y="74.5" text-anchor="middle">1</text>
<circle cx="364" cy="70" r="13" fill="#934900"/><text class="step-text" x="364" y="74.5" text-anchor="middle">2</text>
<circle cx="596" cy="70" r="13" fill="#A50E0E"/><text class="step-text" x="596" y="74.5" text-anchor="middle">3</text>
<circle cx="828" cy="70" r="13" fill="#0D652D"/><text class="step-text" x="828" y="74.5" text-anchor="middle">4</text>

<!-- 1 Collect and conclude -->
<rect class="card" x="24" y="98" width="216" height="252" rx="12"/>
<text class="title" x="40" y="126">Collect and conclude</text>
<text class="caption" x="40" y="148">A sensor collects Jira;</text>
<text class="caption" x="40" y="166">you record the decision.</text>
<rect class="box" x="36" y="182" width="192" height="52" rx="8"/>
<text class="code" x="48" y="203">jira:review</text>
<text class="code" x="48" y="223"><tspan class="key">status</tspan>: <tspan class="wait">In review</tspan></text>
<rect x="36" y="246" width="192" height="92" rx="8" fill="#D2E3FC"/>
<text class="code path" x="48" y="265">projects/new-website.md</text>
<text class="note" x="48" y="287">Hold public launch:</text>
<text class="note" x="48" y="306">accessibility review</text>
<text class="note" x="48" y="325">still blocks it.</text>

<!-- 2 The evidence moves on -->
<rect class="card" x="256" y="98" width="216" height="252" rx="12"/>
<text class="title" x="272" y="126">The evidence moves on</text>
<text class="caption" x="272" y="148">The review moves to Done</text>
<text class="caption" x="272" y="166">upstream; collect again.</text>
<rect class="box" x="268" y="182" width="192" height="52" rx="8"/>
<text class="code" x="280" y="203"><tspan class="muted">$</tspan> bf collect jira</text>
<text class="code" x="280" y="223">"updated": 1</text>
<rect class="box" x="268" y="246" width="192" height="52" rx="8"/>
<text class="code" x="280" y="267">jira:review</text>
<text class="code" x="280" y="287"><tspan class="key">status</tspan>: <tspan class="ok">Done</tspan></text>

<!-- 3 BF flags the conclusion -->
<rect x="488" y="98" width="216" height="252" rx="12" fill="#FFFFFF" stroke="#A50E0E" stroke-width="1.5"/>
<text class="title" x="504" y="126">BF flags the project</text>
<text class="caption" x="504" y="148">Linked evidence is newer</text>
<text class="caption" x="504" y="166">than the note's last edit.</text>
<rect x="500" y="182" width="192" height="156" rx="8" fill="#FAD2CF"/>
<text class="code" x="512" y="205"><tspan class="muted">$</tspan> bf read</text>
<text class="code" x="526" y="222">project:new-website</text>
<text class="code" x="512" y="243">"review": <tspan class="flag">true</tspan>,</text>
<text class="code" x="512" y="262">"review_reasons":</text>
<text class="code" x="526" y="280">[<tspan class="flag">"newer_evidence"</tspan>],</text>
<text class="code" x="512" y="301">"newer":</text>
<text class="code" x="526" y="319">[<tspan class="flag">"jira:review"</tspan>]</text>

<!-- 4 Update, and it clears -->
<rect class="card" x="720" y="98" width="216" height="252" rx="12"/>
<text class="title" x="736" y="126">Update, and it clears</text>
<text class="caption" x="736" y="148">Read the record, then</text>
<text class="caption" x="736" y="166">update the conclusion.</text>
<rect x="732" y="182" width="192" height="92" rx="8" fill="#D2E3FC"/>
<text class="code path" x="744" y="201">projects/new-website.md</text>
<text class="note" x="744" y="223">Launch is no longer</text>
<text class="note" x="744" y="242">blocked: the review</text>
<text class="note" x="744" y="261">is done.</text>
<text class="done" x="736" y="304">✓ Next actions updated</text>
<text class="done" x="736" y="328">✓ Review flag cleared</text>
</svg>
