# https://lefthook.dev/configuration/
# Jobs run in list order: formatters fix and restage only the staged files, then checks validate the tree.
pre-commit:
  jobs:
    - name: format docs and config
      glob: "*.{md,json,jsonc,yaml,yml,toml}"
      run: mise run format:dprint {staged_files}
      stage_fixed: true
    - name: sort Python imports
      glob: "*.py"
      run: mise run format:imports {staged_files}
      stage_fixed: true
    - name: format Python
      glob: "*.py"
      run: mise run format:python {staged_files}
      stage_fixed: true
    # The default history/worktree pass cannot see a partially staged snapshot exactly.
    - name: scan staged secrets
      run: mise run check:leaks:staged
    - name: check
      run: mise run check
pre-push:
  jobs:
    - name: test
      run: mise run test
