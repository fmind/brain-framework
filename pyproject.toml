# https://packaging.python.org/en/latest/specifications/pyproject-toml/
[project]
name = "brain-framework"
version = "22.0.0"
description = "Brain Framework is a local-first brain for you and your AI agents. It collects evidence from your tools into plain files you own, connects them through an ontology you declare, lets any agent harness search and read offline, and wakes your harness when declarative when: rules or reviewed gates spot new evidence."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Médéric Hurier" }]
keywords = [
  "ai",
  "ai-agents",
  "agent-memory",
  "agent-skills",
  "agents-md",
  "context-engineering",
  "knowledge-graph",
  "knowledge-management",
  "local-first",
  "mcp",
  "model-context-protocol",
  "ontology",
  "personal-knowledge-management",
  "python",
  "second-brain",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
  "Typing :: Typed",
]
dependencies = [
  "markdown-it-py>=4.2.0,<5",
  "pydantic>=2.13.5,<3",
  "pyyaml>=6.0.3,<7",
  "rich>=15.0.0,<16",
  "typer>=0.27.2",
]

[project.optional-dependencies]
# `bf mcp` only: most people call the CLI, and the MCP SDK brings most of the runtime closure.
mcp = ["mcp>=2.1.1,<3"]

[project.urls]
Changelog = "https://fmind.github.io/brain-framework/changelog/"
Documentation = "https://fmind.github.io/brain-framework/"
Issues = "https://github.com/fmind/brain-framework/issues"
Repository = "https://github.com/fmind/brain-framework"
Security = "https://github.com/fmind/brain-framework/security/policy"

[project.scripts]
bf = "bf:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bf"

[dependency-groups]
dev = [
  # The checkout tests and documents `bf mcp`, so its environment always holds the optional MCP SDK.
  "brain-framework[mcp]",
  "jsonschema>=4.26.0,<5",
  # Imported directly by tests/test_readme.py: Zensical slugs headings with Python-Markdown.
  "markdown>=3.11",
  # Imported directly by scripts/notices.py to parse requirements and normalize names.
  "packaging>=26.3",
  "pytest-cov>=7.1.0",
  "pytest-watcher>=0.6.3",
  "pytest-xdist>=3.8.0",
  "pytest>=9.1.1",
  "ruff>=0.16.6",
  "ty>=0.0.70,<0.1",
  # The extra validates classifiers offline instead of downloading them or skipping the check.
  "validate-pyproject[all]>=0.25",
  "zensical>=0.1.0,<0.2",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["*.md"] # dprint owns Markdown, including its Python code blocks.
# Skill scripts and copied examples run with the host's python3, not the package interpreter.
per-file-target-version = { "src/bf/skills/*/scripts/*.py" = "py311", "examples/**/*.py" = "py311" }

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = [
  "A", # Avoid shadowing Python builtins.
  "ARG", # Find unused function arguments.
  "ASYNC", # Catch async and cancellation mistakes.
  "B", # Catch likely bugs (flake8-bugbear).
  "BLE", # Catch blind except clauses that swallow errors.
  "C4", # Simplify comprehensions.
  "E", # Enforce pycodestyle errors.
  "ERA", # Remove commented-out code.
  "F", # Find undefined names and unused imports (Pyflakes).
  "FA", # Check future-annotations usage.
  "FURB", # Modernize and simplify Python idioms (refurb).
  "I", # Sort imports (isort).
  "ISC", # Catch accidental implicit string concatenation.
  "LOG", # Check logging API usage.
  "N", # Enforce Python naming conventions.
  "PERF", # Avoid common performance pitfalls.
  "PGH", # Require specific lint and type-checker suppressions.
  "PIE", # Remove unnecessary code constructs.
  "PLE", # Catch Pylint errors.
  "PLW", # Catch Pylint warnings.
  "PT", # Keep pytest fixtures and assertions consistent.
  "PTH", # Prefer pathlib for filesystem operations.
  "Q", # Keep string quoting consistent.
  "RET", # Simplify return statements.
  "RSE", # Remove redundant exception syntax.
  "RUF", # Enable Ruff-specific correctness and style checks.
  "S", # Catch common security mistakes (Bandit).
  "SIM", # Simplify control flow and expressions.
  "SLF", # Flag access to private class members.
  "T10", # Remove debugger calls.
  "T20", # Flag accidental print statements.
  "TID", # Keep imports explicit and tidy.
  "UP", # Use syntax supported by the target Python version.
  "W", # Enforce pycodestyle warnings.
]
ignore = [
  "ASYNC240", # Brain Framework performs bounded local filesystem work from async MCP handlers.
  "E501", # Long CLI help and schema descriptions are clearer as one string.
  "PLW0108", # Unnecessary-lambda is style outside Ruff's default set.
  "PLW2901", # Deliberate loop-variable rebinding is outside Ruff's default set.
]

[tool.ruff.lint.per-file-ignores]
"examples/**/_bf.py" = [
  "A002", # `emit_receipt(id=...)` matches BF's channel receipt field name.
  "S603", # Helpers invoke `bf` with literal argv lists and no shell.
  "S607", # `bf` is resolved on the PATH Brain Framework or the host provides.
]
"examples/channels/**" = [
  "S603", # Channel adapters invoke notifier CLIs with literal argv lists and no shell.
]
"examples/hooks/**" = [
  "BLE001", # Silent hooks must exit 0 with no output on any unexpected error.
  "S607", # Hooks resolve `git` by bare name on PATH with literal arguments.
]
"examples/sensors/**" = [
  "S603", # Adapters invoke provider CLIs with literal argv lists; no shell is involved.
  "S607", # Provider CLIs are resolved by bare name on the PATH Brain Framework sanitizes.
  "T201", # Adapters print exactly one JSON array to stdout.
]
"examples/sensors/_sensor.py" = [
  "A002", # `record(id=...)` matches BF's record field name.
  "BLE001", # `main()` and `cli()` catch unexpected exceptions so tracebacks never quote provider data.
  "S310", # `fetch()` rejects non-HTTPS schemes, credentials and cross-host redirects before opening.
]
"src/bf/skills/*/scripts/*.py" = [
  "S603", # Skill helpers invoke `bf read` offline with validated literal argv lists.
  "S607", # Skill helpers use the host's installed `bf` executable on PATH.
]
"tests/**" = [
  "BLE001", # Worker-thread test helpers record any exception so the test thread can assert on it.
  "S101", # pytest assertions are the test contract.
  "T201", # Test diagnostics may use print.
]

[tool.ty.rules]
blanket-ignore-comment = "error" # Require `ty: ignore[<rule>]`; Ruff PGH003 checks only `type: ignore`.

[tool.pytest]
addopts = ["-ra"]
# A test still running after 300 seconds dumps every thread's traceback and ends the run, long before CI's 30-minute job
# timeout. Subprocess waits in tests stay within 120 seconds. The timeout is a string option.
faulthandler_timeout = "300"
faulthandler_exit_on_timeout = true
filterwarnings = ["error"]
strict = true
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["bf"]
# Skill helpers run as separate processes with the agent's python3; their tests exercise them there.
omit = ["*/bf/skills/*"]
# Also measure Python subprocesses, such as `python -m bf`, which pytest-cov 7 no longer does; one started with a fresh
# environment stays unmeasured. Each writes a .coverage.* file that the run combines.
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
skip_empty = true
