# https://packaging.python.org/en/latest/specifications/pyproject-toml/
[project]
name = "brain-framework"
version = "10.0.0"
description = "Plain-file brains for people and their agents"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Médéric Hurier" }]
keywords = ["agents", "knowledge", "mcp", "retrieval"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "markdown-it-py>=4.2.0,<5",
  "mcp>=2.1.1,<3",
  "pydantic>=2.13.5,<3",
  "pyyaml>=6.0.3,<7",
  "typer>=0.27.2,<1",
]

[project.urls]
Documentation = "https://fmind.github.io/brain-framework/"
Issues = "https://github.com/fmind/brain-framework/issues"
Repository = "https://github.com/fmind/brain-framework"

[project.scripts]
bf = "bf:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bf"

[dependency-groups]
dev = [
  "pytest-cov>=7.1.0",
  "pytest-watcher>=0.6.3",
  "pytest>=9.1.1",
  "ruff>=0.16.6",
  "ty>=0.0.70,<0.1",
  "validate-pyproject>=0.25",
  "zensical>=0.0.59,<0.1",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "E",
  "ERA",
  "F",
  "FA",
  "FURB",
  "I",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PT",
  "PTH",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "T10",
  "T20",
  "TID",
  "UP",
  "W",
]
ignore = [
  "ASYNC240", # Brain Framework performs bounded local filesystem work from async MCP handlers.
  "E501", # Long CLI help and schema descriptions are clearer as one string.
]

[tool.ruff.lint.per-file-ignores]
"examples/sensors/**" = [
  "S603", # Adapters invoke provider CLIs with literal argv lists; no shell is involved.
  "S607", # Provider CLIs are resolved by bare name on the PATH Brain Framework sanitizes.
  "T201", # Adapters print exactly one JSON array to stdout.
]
"tests/**" = [
  "S101", # pytest assertions are the test contract.
  "T201", # Test diagnostics may use print.
]

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["bf"]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
