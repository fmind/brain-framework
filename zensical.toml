# https://zensical.org/docs/setup/basics/
[project]
site_name = "Brain Framework"
site_url = "https://fmind.github.io/brain-framework/"
site_description = "Plain-file brains for people and their agents."
site_author = "Médéric Hurier"
copyright = "Copyright &copy; 2026 Médéric Hurier (Fmind)."
docs_dir = "docs"
site_dir = "site"
strict = true
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/accessibility.js"]
nav = [
  { "Overview" = "docs/index.md" },
  { "Getting started" = "docs/getting-started.md" },
  { "Understand Brain Framework" = [
    { "Brain layout and knowledge" = "docs/brain.md" },
    { "Sensors" = "docs/sensors.md" },
    { "Search and read" = "docs/search.md" },
    { "Team brains" = "docs/team.md" },
  ] },
  { "Reference" = [
    { "Command reference" = "docs/commands.md" },
    { "Configuration schema" = "docs/schema.md" },
  ] },
  { "Connect agents" = [
    { "Agent workflows" = "docs/agents.md" },
    { "MCP server" = "docs/mcp.md" },
  ] },
  { "Trust and legal" = [
    { "Privacy and security" = "docs/privacy.md" },
    { "Third-party notices" = "third-party-notices.md" },
  ] },
]

[project.theme]
custom_dir = "overrides"
language = "en"
logo = "fmind-logo.webp"
favicon = "fmind-logo.webp"
font = false
features = [
  "content.code.copy",
  "content.code.select",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
]

[[project.extra.social]]
icon = "lucide/git-branch"
link = "https://github.com/fmind/brain-framework"
name = "Brain Framework on GitHub"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}

[project.plugins.redirects]
# Preserve the original Pages contract: the repository root leads to the documentation overview.
redirect_maps = { "index.md" = "docs/index.md" }

[project.plugins.search]
# Zensical 0.0.59's visible search dialog is absent from the accessibility tree.
enabled = false
