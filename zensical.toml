# https://zensical.org/docs/setup/basics/
[project]
site_name = "Brain Framework"
site_url = "https://fmind.github.io/brain-framework/"
site_description = "Centralize information from your tools in a file-based brain for people and AI agents."
site_author = "Médéric Hurier"
copyright = "Copyright &copy; 2026 Médéric Hurier (Fmind)."
docs_dir = "docs"
# Mirror the public URL path so offline link checks need no temporary symlinks.
site_dir = "site/brain-framework"
strict = true
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/accessibility.js"]
nav = [
  { "Overview" = "docs/index.md" },
  { "Getting started" = "docs/getting-started.md" },
  { "Core concepts" = "docs/concepts.md" },
  { "Glossary" = "docs/glossary.md" },
  { "Use your brain" = [
    { "Files and notes" = "docs/brain.md" },
    { "Search and read" = "docs/search.md" },
    { "Linking knowledge" = "docs/links.md" },
    { "Check your brain" = "docs/checks.md" },
  ] },
  { "Maintain your brain" = [
    { "Sensors" = "docs/sensors.md" },
    { "Routines" = "docs/routines.md" },
    { "Schedule updates" = "docs/schedule.md" },
  ] },
  { "Team setup" = "docs/team.md" },
  { "Connect agents" = [
    { "Agent workflows" = "docs/agents.md" },
    { "MCP server" = "docs/mcp.md" },
  ] },
  { "Advanced" = [
    { "Connect context across tools" = "docs/context-hub.md" },
    { "Evaluate a team pilot" = "docs/pilot.md" },
  ] },
  { "Reference" = [
    { "Commands" = "docs/commands.md" },
    { "Configuration" = "docs/configuration.md" },
    { "Record schema" = "docs/schema.md" },
    { "Link syntax" = "docs/link-reference.md" },
    { "Retrieval contract" = "docs/retrieval.md" },
    { "Install and update" = "docs/upgrades.md" },
    { "Limits and safeguards" = "docs/limits.md" },
  ] },
  { "Privacy and legal" = [
    { "Privacy and security" = "docs/privacy.md" },
    { "Third-party notices" = "third-party-notices.md" },
  ] },
]

[project.theme]
custom_dir = "overrides"
language = "en"
logo = "assets/brain-framework.svg"
favicon = "assets/brain-framework.svg"
font = false
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
]

[[project.extra.social]]
icon = "lucide/git-branch"
link = "https://github.com/fmind/brain-framework"
name = "Brain Framework on GitHub"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}

[project.plugins.redirects]
# Preserve the original Pages contract: the repository root leads to the documentation overview.
redirect_maps = { "index.md" = "docs/index.md" }

[project.plugins.search]
# Zensical 0.0.59's visible search dialog is absent from the accessibility tree.
enabled = false
