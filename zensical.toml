# https://zensical.org/docs/setup/basics/
[project]
site_name = "Brain Framework"
site_url = "https://fmind.github.io/brain-framework/"
site_description = "🧠 Brain Framework: from information to informed actions."
site_author = "Médéric Hurier"
copyright = "Copyright &copy; 2026 Médéric Hurier (Fmind)."
docs_dir = "docs"
# Mirror the public URL path so offline link checks need no temporary symlinks.
site_dir = "site/brain-framework"
strict = true
extra_css = ["stylesheets/fmind.css", "stylesheets/extra.css"]
extra_javascript = ["javascripts/accessibility.js"]
repo_url = "https://github.com/fmind/brain-framework"
repo_name = "fmind/brain-framework"
# Relative to repo_url; Zensical appends each page's path under docs_dir for the edit and view actions.
edit_uri = "edit/main/docs/"
# Top-level entries render as header tabs; their groups render as sidebar sections.
# Keep every entry a site page: external URLs carry no outbound marker, so the footer and header own them.
nav = [
  { "Overview" = "index.md" },
  { "Guides" = [
    { "Getting started" = "getting-started.md" },
    { "Authoring" = "authoring.md" },
    { "Retrieval" = "retrieval.md" },
    { "Operations" = "operations.md" },
  ] },
  { "Reference" = [
    { "Reference" = "reference.md" },
    { "Changelog" = "changelog.md" },
  ] },
  { "Privacy and legal" = [
    { "Third-party notices" = "third-party-notices.md" },
    { "License" = "license.md" },
  ] },
]

# Fail strict builds on every Markdown reference and footnote problem, not only broken links.
[project.validation]
invalid_links = true
invalid_link_anchors = true
unresolved_references = true
unresolved_footnotes = true
unused_definitions = true
unused_footnotes = true
shadowed_definitions = true
shadowed_footnotes = true

[project.theme]
custom_dir = "overrides"
language = "en"
logo = "assets/brain-framework.svg"
favicon = "assets/brain-framework.svg"
# Keep fonts local: Google Fonts would contact a third party on every visit.
font = false
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
# Simple Icons are CC0; Lucide (the theme default) has no brand marks.
repo = "simple/github"
edit = "lucide/pencil"
view = "lucide/eye"

# Follow the system preference until the reader picks light or dark.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "simple/github"
link = "https://github.com/fmind/brain-framework"
name = "Brain Framework on GitHub"

[[project.extra.social]]
icon = "simple/pypi"
link = "https://pypi.org/project/brain-framework/"
name = "Brain Framework on PyPI"

[project.markdown_extensions]
attr_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
# Changelog and license pages include the repository files; a missing file fails the build.
pymdownx.snippets.check_paths = true
pymdownx.snippets.restrict_base_path = true
pymdownx.superfences = {}

[project.plugins.redirects]
# Preserve published URLs: legacy /docs/* paths redirect cleanly to the flattened top-level pages.
redirect_maps = { "docs/index.md" = "index.md", "docs/getting-started.md" = "getting-started.md", "docs/authoring.md" = "authoring.md", "docs/retrieval.md" = "retrieval.md", "docs/operations.md" = "operations.md", "docs/reference.md" = "reference.md", "docs/agents.md" = "authoring.md", "docs/assist.md" = "retrieval.md", "docs/brain.md" = "authoring.md", "docs/channels.md" = "operations.md#ingest-sensor-records", "docs/checks.md" = "operations.md", "docs/commands.md" = "reference.md", "docs/concepts.md" = "index.md", "docs/configuration.md" = "reference.md", "docs/context-hub.md" = "getting-started.md", "docs/glossary.md" = "index.md", "docs/highlights.md" = "operations.md#ingest-sensor-records", "docs/jobs.md" = "operations.md#ingest-sensor-records", "docs/limits.md" = "operations.md#limits-and-safeguards", "docs/link-reference.md" = "reference.md", "docs/links.md" = "authoring.md#connect-notes-and-records", "docs/mcp.md" = "retrieval.md", "docs/pilot.md" = "getting-started.md", "docs/privacy.md" = "operations.md#privacy-and-security-boundaries", "docs/prompts.md" = "operations.md#ingest-sensor-records", "docs/routines.md" = "operations.md#ingest-sensor-records", "docs/schedule.md" = "operations.md#ingest-sensor-records", "docs/schema.md" = "reference.md#bf-yaml-schema", "docs/search.md" = "retrieval.md", "docs/sensors.md" = "operations.md#ingest-sensor-records", "docs/team.md" = "operations.md#privacy-and-security-boundaries", "docs/troubleshooting.md" = "operations.md", "docs/upgrades.md" = "getting-started.md#upgrade-and-pinned-runtimes" }

# Client-side and offline: the index ships with the site and queries never leave the browser.
[project.plugins.search]
# Publish llms.txt and llms-full.txt so agents can read the guides as Markdown.
[project.plugins.llmstxt]
full_output = "llms-full.txt"
markdown_description = "Brain Framework (`bf`) keeps a local-first brain built on YAML for config, JSONL for records (`memories/<source>.jsonl`), and Markdown for humans: required per-source JSON Schemas, Python-Markdown attr_list metadata, universal refs & `bf://` URLs, and offline retrieval with rg, jq, and DuckDB. Release notes and upgrade steps are in the [changelog](https://raw.githubusercontent.com/fmind/brain-framework/main/CHANGELOG.md)."

[project.plugins.llmstxt.sections]
# Descriptions repeat each page's front matter so agents can choose a page; tests/test_docs.py keeps them in sync.
Overview = [
  { "index.md" = "YAML for config, JSONL for records, and Markdown for humans. Enforce required JSON Schemas, resolve universal refs, and query with rg, jq, and DuckDB." },
]
Guides = [
  { "getting-started.md" = "Create a brain, add a source schema, ingest a record, write a Markdown decision with attr_list metadata and universal refs, and query JSONL records with rg and jq." },
  { "authoring.md" = "Write OKF Markdown with Python-Markdown attr_list metadata, connect notes and brains with universal refs and bf:// URLs, and enforce required JSON Schemas in schemas/." },
  { "retrieval.md" = "Orient with bf status and bf review, resolve universal refs with bf read, and query flat JSONL records in memories/ and usages/ with rg, jq, DuckDB, and bf check." },
  { "operations.md" = "Compose loops with sensors/, routines/, and agents/ conventions, stdout/stderr JSONL streams, when triggers, and bf watch in bf.yaml, ingest atomically, and enforce security boundaries." },
]
Reference = [
  { "reference.md" = "Complete contract lookup for bf CLI commands, exit codes, 3x3 brain layout, bf.yaml v18, and published JSON Schemas." },
]
