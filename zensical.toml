# https://zensical.org/docs/setup/basics/
[project]
site_name = "Brain Framework"
site_url = "https://fmind.github.io/brain-framework/"
site_description = "🧠 Brain Framework: from information to informed actions."
site_author = "Médéric Hurier"
copyright = "Copyright &copy; 2026 Médéric Hurier (Fmind)."
docs_dir = "docs"
# Mirror the public URL path so offline link checks need no temporary symlinks.
site_dir = "site/brain-framework"
strict = true
extra_css = ["stylesheets/fmind.css", "stylesheets/extra.css"]
extra_javascript = ["javascripts/accessibility.js"]
repo_url = "https://github.com/fmind/brain-framework"
repo_name = "fmind/brain-framework"
# Relative to repo_url; Zensical appends each page's path under docs_dir for the edit and view actions.
edit_uri = "edit/main/docs/"
# Top-level entries render as header tabs; their groups render as sidebar sections.
# Keep every entry a site page: external URLs carry no outbound marker, so the footer and header own them.
nav = [
  { "Overview" = "docs/index.md" },
  { "Guides" = [
    { "Getting started" = "docs/getting-started.md" },
    { "Authoring" = "docs/authoring.md" },
    { "Retrieval" = "docs/retrieval.md" },
    { "Jobs" = "docs/jobs.md" },
    { "Assist" = "docs/assist.md" },
    { "Operations" = "docs/operations.md" },
  ] },
  { "Reference" = [
    { "Reference" = "docs/reference.md" },
    { "Changelog" = "changelog.md" },
  ] },
  { "Privacy and legal" = [
    { "Third-party notices" = "third-party-notices.md" },
    { "License" = "license.md" },
  ] },
]

# Fail strict builds on every Markdown reference and footnote problem, not only broken links.
[project.validation]
invalid_links = true
invalid_link_anchors = true
unresolved_references = true
unresolved_footnotes = true
unused_definitions = true
unused_footnotes = true
shadowed_definitions = true
shadowed_footnotes = true

[project.theme]
custom_dir = "overrides"
language = "en"
logo = "assets/brain-framework.svg"
favicon = "assets/brain-framework.svg"
# Keep fonts local: Google Fonts would contact a third party on every visit.
font = false
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
# Simple Icons are CC0; Lucide (the theme default) has no brand marks.
repo = "simple/github"
edit = "lucide/pencil"
view = "lucide/eye"

# Follow the system preference until the reader picks light or dark.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "simple/github"
link = "https://github.com/fmind/brain-framework"
name = "Brain Framework on GitHub"

[[project.extra.social]]
icon = "simple/pypi"
link = "https://pypi.org/project/brain-framework/"
name = "Brain Framework on PyPI"

[project.markdown_extensions]
attr_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
# Changelog and license pages include the repository files; a missing file fails the build.
pymdownx.snippets.check_paths = true
pymdownx.snippets.restrict_base_path = true
pymdownx.superfences = {}

[project.plugins.redirects]
# Preserve published URLs: the repository root leads to the overview, and retired pages redirect to their unified home.
redirect_maps = { "index.md" = "docs/index.md", "docs/agents.md" = "docs/authoring.md", "docs/brain.md" = "docs/authoring.md", "docs/channels.md" = "docs/assist.md", "docs/checks.md" = "docs/operations.md", "docs/commands.md" = "docs/reference.md", "docs/concepts.md" = "docs/index.md", "docs/configuration.md" = "docs/reference.md", "docs/context-hub.md" = "docs/getting-started.md", "docs/glossary.md" = "docs/index.md", "docs/highlights.md" = "docs/jobs.md#selected-highlights", "docs/limits.md" = "docs/operations.md#limits-and-safeguards", "docs/link-reference.md" = "docs/reference.md", "docs/links.md" = "docs/authoring.md#connect-notes-and-records", "docs/mcp.md" = "docs/retrieval.md", "docs/pilot.md" = "docs/getting-started.md", "docs/privacy.md" = "docs/operations.md#privacy-and-security-boundaries", "docs/prompts.md" = "docs/assist.md", "docs/routines.md" = "docs/jobs.md", "docs/schedule.md" = "docs/assist.md", "docs/schema.md" = "docs/reference.md#bf-yaml-schema", "docs/search.md" = "docs/retrieval.md", "docs/sensors.md" = "docs/jobs.md", "docs/team.md" = "docs/operations.md#privacy-and-security-boundaries", "docs/troubleshooting.md" = "docs/operations.md", "docs/upgrades.md" = "docs/getting-started.md#upgrade-and-pinned-runtimes" }

# Client-side and offline: the index ships with the site and queries never leave the browser.
[project.plugins.search]
# Publish llms.txt and llms-full.txt so agents can read the guides as Markdown.
[project.plugins.llmstxt]
full_output = "llms-full.txt"
markdown_description = "Brain Framework (`bf`) keeps a brain in plain files: collection, validation, a knowledge graph and offline retrieval for people and agents. Release notes and upgrade steps are in the [changelog](https://raw.githubusercontent.com/fmind/brain-framework/main/CHANGELOG.md)."

[project.plugins.llmstxt.sections]
# Descriptions repeat each page's front matter so agents can choose a page; tests/test_docs.py keeps them in sync.
Overview = [
  { "docs/index.md" = "Keep evidence, decisions and next steps in plain files that you and your agents search, read and connect." },
]
Guides = [
  { "docs/getting-started.md" = "Create a brain, save your first project decision, search its reason, register, install /bf and connect MCP." },
  { "docs/authoring.md" = "Write OKF projects, concepts and resumable actions; link evidence with citations, identities, typed relations and attributes." },
  { "docs/retrieval.md" = "Orient with review pages, search words or identities, verify sections, paginate large reads, export graph claims and connect MCP." },
  { "docs/jobs.md" = "Configure bf.yaml jobs for record collection, direct bf ingest, declarative JSON maps, routines and process safety." },
  { "docs/assist.md" = "Configure prompt harnesses, inbound and outbound channels, canonical events, gates, wakes, failure incidents, queues and bf watch." },
  { "docs/operations.md" = "Inspect status and doctor checks, validate notes, evaluate retrieval, back up and recover state, enforce limits and review privacy." },
]
Reference = [
  { "docs/reference.md" = "Complete lookup for BF v25 CLI commands, brain layout, bf.yaml v11 schema, OKF notes, records, identities, ?rel= links and exit codes." },
]
